# Cloudflare Workers + Containers deployment for the Transform Church API
# server. The Worker itself is a thin router: it forwards every request to
# the containerized Node/Express app (built from ./Dockerfile) and, via
# `outboundByHost` on the Container class in src/worker.ts, bridges the
# container's object-storage calls to this R2 bucket (containers have no
# direct binding access -- see src/worker.ts for why).
#
# Secrets (never put these here -- set with `wrangler secret put <NAME>`,
# or in the dashboard under Workers & Pages > this Worker > Settings >
# Variables and Secrets):
#   DATABASE_URL, AUTH_JWT_SECRET, SESSION_SECRET, STORAGE_SIGNING_SECRET,
#   PCO_CLIENT_ID, PCO_CLIENT_SECRET, RESEND_API_KEY, GOOGLE_API_KEY,
#   WEEKLY_PULSE_RUN_SECRET (any long random string -- generate with e.g.
#   `openssl rand -hex 32`; authenticates the Monday Cron Trigger's call to
#   the container, see src/worker.ts's scheduled() and routes/weeklyPulse.ts)
#   GOOGLE_SERVICE_ACCOUNT_KEY (a Google Cloud service account's JSON key,
#   on one line -- share the Wiki's staff Drive folder with that service
#   account's client_email) and WIKI_DRIVE_SYNC_RUN_SECRET (same pattern as
#   WEEKLY_PULSE_RUN_SECRET, for the daily Wiki Drive sync Cron Trigger --
#   see lib/googleServiceAccount.ts and routes/adminWikiDriveSync.ts)
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN (from the Twilio console) plus
#   EITHER TWILIO_MESSAGING_SERVICE_SID (preferred) OR TWILIO_FROM_NUMBER (a
#   single E.164 number) -- powers "Group Texting" (routes/groupBroadcasts.ts,
#   lib/sms.ts). None of this is wired to a cron trigger -- it's an
#   admin-triggered send, not scheduled. Sending real volume to US numbers
#   also requires Twilio's A2P 10DLC registration (brand + campaign), a
#   one-time step done in the Twilio console, outside what these secrets
#   alone cover.
#   Bootstrap-only (set for the first deploy, then remove):
#   INITIAL_ADMIN_EMAIL or INITIAL_ADMIN_EXTERNAL_USER_ID
#
# This Worker now serves ONLY the API, at api.transformchurch.app -- the
# frontend (artifacts/transform-church) is served by its own Worker
# (transform-church-web, see artifacts/transform-church/wrangler.toml),
# with the apex domain (transformchurch.app) pointed at that Worker instead.
# Remember to also update the callback URL registered in the Planning
# Center OAuth app to match PCO_REDIRECT_URI below.

name = "transform-church-api"
main = "src/worker.ts"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

# Lets us read the container's actual stdout/stderr and the Worker's own
# request logs/traces in the dashboard (Containers > this app > Logs, and
# Workers & Pages > this Worker > Logs). Off by default; turned on while
# diagnosing the "Container suddenly disconnected" crash-loop after the
# 2026-09-30 deploy. Safe to turn back off later by removing this block.
[observability]
enabled = true

[[containers]]
class_name = "TransformChurchContainer"
image = "./Dockerfile"
max_instances = 1
# "lite" (the default) is 1/16 vCPU, 256MiB memory, 2GB disk -- too small on
# every axis for Node + a Python venv (matplotlib/pandas/numpy) running
# side by side, even with LibreOffice removed. "basic" (1/4 vCPU, 1GiB
# memory, 4GB disk) gives comfortable headroom on image size and enough
# memory for the report engine to run without being killed.
instance_type = "basic"

[[durable_objects.bindings]]
name = "API_CONTAINER"
class_name = "TransformChurchContainer"

[exports.TransformChurchContainer]
type = "durable-object"
storage = "sqlite"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "transform-church-storage"

# Fires the Worker's scheduled() handler (src/worker.ts), which makes an
# internal, secret-authenticated call into the container for each entry
# below ("0 11 * * 1" -> Weekly Pulse's POST /api/weekly-pulse/run-scheduled;
# "0 6 * * *" -> the Wiki Drive sync's
# POST /api/admin/wiki-drive-sync/run-scheduled, which also has
# WIKI_DRIVE_SYNC_CRON in worker.ts hardcoded to match it -- keep both in
# sync if this time ever changes). Cloudflare Cron Triggers run in UTC with
# no timezone support, so both are pinned to fixed UTC times rather than
# "local morning"; 11:00 UTC is 6-7am US Eastern depending on daylight
# saving, and 6:00 UTC is 1-2am US Eastern (picked to match this feature's
# previous default "sync around 6am UTC" behavior from its in-process
# fallback scheduler -- see WIKI_DRIVE_SYNC_HOUR_UTC in
# lib/wikiDriveSync.ts's startWikiDriveScheduler()). Adjust here (and
# redeploy) if a different time is wanted for either.
# "0 7 * * 1" -> the weekly group attendance auto-sync,
# POST /api/group-history/run-scheduled (GROUP_HISTORY_SYNC_CRON in
# worker.ts must match). 07:00 UTC Monday is 3am US Eastern during daylight
# saving time and 2am in winter. It does nothing unless an admin has turned
# "Update automatically every week" on in Group attendance history.
[triggers]
crons = ["0 11 * * 1", "0 6 * * *", "0 7 * * 1"]

[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"
PCO_REDIRECT_URI = "https://api.transformchurch.app/api/auth/planning-center/callback"
# Used to build absolute URLs (e.g. file-upload links) outside the request
# context.
PUBLIC_API_URL = "https://api.transformchurch.app"
# Comma-separated trusted browser origins for CORS -- the frontend now lives
# on a different origin (transformchurch.app, served by the separate
# transform-church-web Worker), so it must be listed here explicitly. This
# is also what the Planning Center sign-in flow checks an absolute
# `return_to` URL against (see normalizeReturnTo in lib/planningCenter.ts),
# so login will fail with "invalid_return_url" if this doesn't include the
# frontend's real origin.
CORS_ALLOWED_ORIGINS = "https://transformchurch.app"
CORS_ALLOW_CREDENTIALS = "false"
FRAME_ANCESTORS = "'self'"
# Sender for all Resend email (Weekly Pulse, assignment emails, Group
# Texting's email channel). Must be on a domain verified in Resend
# (transformchurch.app is). Kept here, not only in the dashboard, because
# `wrangler deploy` replaces dashboard-set vars with this [vars] block --
# when it was missing, EMAIL_FROM reached the container as "" and every
# send failed with Resend's 422 "Invalid from field".
EMAIL_FROM = "Reporting@transformchurch.app"
