kind = "web"
previewPath = "/"
title = "Transform Church"
version = "1.0.0"
id = "artifacts/transform-church"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25632

[services.development]
run = "npm run dev --workspace=@workspace/transform-church"

[services.production]
build = [ "npm", "--workspace=@workspace/transform-church", "run", "build" ]
publicDir = "artifacts/transform-church/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25632"
BASE_PATH = "/"
